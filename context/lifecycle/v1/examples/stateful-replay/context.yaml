apiVersion: context.brotni.com/v1
kind: SimulationContext

metadata:
  name: payments-stateful-replay-context
  description: >
    Advanced stateful replay context for evaluating payment processing candidates
    across a sequential transaction timeline. Use with care: state evolves across
    replay steps.

mode: stateful-replay

environment:
  name: payments-simulation-env
  version: v1
  runtime: kubernetes
  region: eu-test-1

datasets:
  - name: transaction-replay
    ref: dataset://payments/prod-replay/2026-05
    digest: sha256:f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1
    mountPath: /brotni/data/transactions.ndjson
    required: true

state:
  databases:
    - name: payments-db
      source: snapshot://payments-db/baseline-v1
      resetPolicy: restore

  queues:
    - name: payment-events
      hydrationPolicy: replay-from-dataset

isolation:
  network: sandboxed
  filesystem: copy-on-write
  database: restore-from-snapshot
  externalDependencies: mocked

reset:
  afterEachRun: true
  strategy: restore-snapshot

discard:
  afterCampaign: true
  retainForAudit: true

limits:
  maxRunDurationSeconds: 3600
  maxContextAgeSeconds: 86400

reproducibility:
  seed: 99
  recordEnvironment: true
  recordDatasetDigests: true
  recordContextDigest: true

security:
  allowOutboundNetwork: false
  secretPolicy: external-reference-only
  dataClassification: confidential
